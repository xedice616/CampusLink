server.port=${PORT:8787}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/campuslink;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
server.error.include-message=always
spring.servlet.multipart.max-file-size=${CV_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=6MB
spring.servlet.multipart.file-size-threshold=6MB
career.max-file-bytes=${CV_MAX_FILE_BYTES:5242880}
career.retention-days=${CV_RETENTION_DAYS:30}
career.ai.provider=${AI_PROVIDER:openai}
career.ai.model=${AI_MODEL:}
career.ai.api-key=${AI_API_KEY:}
career.ai.timeout=${AI_TIMEOUT:60s}
# Text extractors may include document fragments in diagnostic logs. Disable those logs.
logging.level.org.apache.pdfbox=OFF
logging.level.org.apache.poi=OFF
logging.level.org.springframework.jdbc.core=WARN
logging.level.org.springframework.web=INFO
spring.mvc.log-request-details=false
